<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherixx — Заметки</title>
    <link rel="stylesheet" href="css/notes.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <a href="index.html" class="logo">Aetherixx</a>
            <nav class="menu">
                <a href="workspace.html">Главная</a>
                <a class="active" href="notes.html">Заметки</a>
                <a href="tasks.html">Задачи</a>
                <a href="projects.html">Проекты</a>
            </nav>
            <button class="theme-button" id="themeButton">Сменить тему</button>
        </aside>

        <main class="content">
            <header class="topbar">
                <div>
                    <p class="muted">Рабочее пространство</p>
                    <h1>Заметки</h1>
                </div>
                <a href="login.html" class="logout" id="logoutButton">Выйти</a>
            </header>

            <section class="page-grid page-grid-one">
                <div class="panel">
                    <div class="panel-header">
                        <h2>Мои заметки</h2>
                    </div>
                    <textarea id="noteText" placeholder="Напишите новую заметку..."></textarea>
                    <div class="form-row">
                        <input type="text" id="noteTitle" placeholder="Название заметки">
                        <button id="addNoteButton">Добавить</button>
                    </div>
                    <div class="list" id="notesList"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/notes.js"></script>
</body>
</html>
